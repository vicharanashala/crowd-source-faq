<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yaksha FAQ Portal — Semantic search-powered FAQ and community board for internship students. Ask, discover, and get your doubts solved." />
    <title>Yaksha FAQ Portal</title>
    <link rel="icon" type="image/jpeg" href="/logo-full.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- No-flash theme bootstrap. Runs synchronously before any styles paint
         to apply the persisted theme to <html> and avoid a light/dark flash. -->
    <script src="/theme.js"></script>
    <script>
      // Intercept authentication and session state keys from localStorage to sessionStorage.
      // This allows different tabs in the same window to have completely isolated sessions,
      // enabling you to run the Student Portal and Admin Dashboard side-by-side in the same window.
      (function() {
        const SESSION_KEYS = new Set([
          'yaksha_token',
          'yaksha_refresh_token',
          'yaksha_user',
          'yaksha_active_program_id',
          'yaksha_active_batch_id'
        ]);

        const originalGetItem = Storage.prototype.getItem;
        const originalSetItem = Storage.prototype.setItem;
        const originalRemoveItem = Storage.prototype.removeItem;

        Storage.prototype.getItem = function(key) {
          if (this === window.localStorage && SESSION_KEYS.has(key)) {
            return window.sessionStorage.getItem(key);
          }
          return originalGetItem.call(this, key);
        };

        Storage.prototype.setItem = function(key, value) {
          if (this === window.localStorage && SESSION_KEYS.has(key)) {
            return window.sessionStorage.setItem(key, value);
          }
          return originalSetItem.call(this, key, value);
        };

        Storage.prototype.removeItem = function(key) {
          if (this === window.localStorage && SESSION_KEYS.has(key)) {
            return window.sessionStorage.removeItem(key);
          }
          return originalRemoveItem.call(this, key);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
