name: Tail CSFAQ Service Logs (one-off, read-only)

# Manual, one-off log tail for the 2026-09-25 live-bug investigation.
# Read-only — prints recent journalctl output for csfaq.service, makes
# no writes.

on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Number of recent log lines to print"
        required: false
        default: "200"
        type: string

jobs:
  tail:
    name: SSH Tail Logs
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CSFAQ_DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.CSFAQ_HOST }} >> ~/.ssh/known_hosts

      - name: Tail logs
        env:
          LOG_LINES: ${{ inputs.lines }}
        run: |
          ssh -i ~/.ssh/id_ed25519 csfaq-deploy@${{ secrets.CSFAQ_HOST }} "sudo journalctl -u csfaq.service -n ${LOG_LINES} --no-pager"
