name: Diagnose 3 Specific Users (one-off, read-only)

# Manual, one-off diagnostic for the 3 accounts still missing real
# Samagama data from the 2026-09-25 enrollment audit
# (25010733@scale.iitrpr.ac.in, user_b_trek_program@yaksha.com,
# prateeksinghmbd01@gmail.com). Read-only — makes no writes. Reuses
# the same SSH + Infisical path as deploy-production.yml so no
# production credential (MONGODB_URI included) ever needs to leave
# GitHub Actions.

on:
  workflow_dispatch:

env:
  INFISICAL_ENVIRONMENT: prod
  INFISICAL_SECRET_PATH: /

jobs:
  diagnose:
    name: SSH Run Diagnostic
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CSFAQ_DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.CSFAQ_HOST }} >> ~/.ssh/known_hosts

      - name: Run diagnostic
        run: |
          ssh -i ~/.ssh/id_ed25519 csfaq-deploy@${{ secrets.CSFAQ_HOST }} bash << 'DIAG'
            set -e

            cd /home/csfaq-prod/crowd-source-faq

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Authenticating with Infisical..."
            export INFISICAL_TOKEN=$(npx @infisical/cli@0.43.40 login \
              --method=universal-auth \
              --client-id="${{ secrets.INFISICAL_CLIENT_ID }}" \
              --client-secret="${{ secrets.INFISICAL_CLIENT_SECRET }}" \
              --silent \
              --plain)

            if [ -z "$INFISICAL_TOKEN" ]; then
              echo "Infisical authentication failed"
              exit 1
            fi

            echo "==> Writing backend .env from Infisical..."
            npx @infisical/cli@0.43.40 export \
              --token="$INFISICAL_TOKEN" \
              --projectId="${{ secrets.INFISICAL_PROJECT_ID }}" \
              --env="${{ env.INFISICAL_ENVIRONMENT }}" \
              --path="${{ env.INFISICAL_SECRET_PATH }}" \
              --format=dotenv > apps/backend/.env

            echo "==> Cleaning quotes from env file..."
            sed -i "s/='\(.*\)'/=\1/; s/=\"\(.*\)\"/=\1/" apps/backend/.env

            echo "==> Installing backend dependencies..."
            cd apps/backend
            pnpm install --frozen-lockfile

            echo "==> Running diagnostic for the 3 unresolved accounts..."
            npx tsx src/scripts/diagnose-specific-users.ts

            echo "==> Diagnostic complete. Read-only, no writes made."
          DIAG
